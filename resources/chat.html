<!DOCTYPE html>
<html>

<head>
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Socket.IO chat</title>
  <style>
    body {
      margin: 0;
      padding-bottom: 3rem;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    #form {
      background: rgba(0, 0, 0, 0.15);
      padding: 0.25rem;
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      height: 3rem;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }

    #input {
      border: none;
      padding: 0 1rem;
      flex-grow: 1;
      border-radius: 2rem;
      margin: 0.25rem;
    }

    #input:focus {
      outline: none;
    }

    #form>button {
      background: #333;
      border: none;
      padding: 0 1rem;
      margin: 0.25rem;
      border-radius: 3px;
      outline: none;
      color: #fff;
    }

    #messages {
      list-style-type: none;
      margin: 0;
      padding: 0;
    }

    #messages>li {
      padding: 0.5rem 1rem;
    }

    #messages>li:nth-child(odd) {
      background: #efefef;
    }
  </style>
</head>

<body>
  <ul id="messages"></ul>
  <input id="jwt_txt"
    value="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpZCI6IjY5YzllNGZiNzg3YWY0N2U3MDVmMWUxZCIsImV4cCI6MTc3NDg0NzcyMDYwOSwiaWF0IjoxNzc0ODQ0MTIwfQ.xCazgzusgJ8OUF6xgF1GuGuW7BVhGwXK6BUFA_dr5do"
    type="text">
  <input id="jwt_btn" onclick="loadUser()" type="button" value="getUser">
  <form id="form" action="">
    <input id="input" autocomplete="off" /><button>Send</button>
  </form>
</body>
<script src="/socket.io/socket.io.js"></script>
<script>
  var socket;
  socket.on('welcome', (msg) => {
    alert('em chao anh' + msg)
  })
  function loadUser() {
    let jwt = document.getElementById('jwt_txt').value;
    if (jwt) {
      socket = io({
        auth: {
          token: jwt
        }
      });
    }
    return false;
  }
</script>

</html>
