<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="main.js"></script>
</head>

<body>
    <div>
        <table>
            <thead>
                <tr>
                    <td>
                        ID
                    </td>
                    <td>
                        Title
                    </td>
                    <td>
                        Views
                    </td>
                </tr>
            </thead>
            <tbody id="body-table">
                
            </tbody>
        </table>
    </div>
    <div>
        <h3>Posts</h3>
        <input type="text" id="id_txt" placeholder="ID (để trống khi tạo mới)"/>
        <input type="text" id="title_txt" placeholder="Title"/>
        <input type="text" id="views_txt" placeholder="Views"/>
        <input type="submit" value="Save" onclick="Save()"/>
    </div>
    
    <div style="margin-top: 30px;">
        <h3>Comments</h3>
        <table>
            <thead>
                <tr>
                    <td>ID</td>
                    <td>Text</td>
                    <td>Post ID</td>
                    <td>Action</td>
                </tr>
            </thead>
            <tbody id="body-comments-table">
                
            </tbody>
        </table>
    </div>
    <div>
        <input type="text" id="comment_id_txt" placeholder="ID (để trống khi tạo mới)"/>
        <input type="text" id="comment_text_txt" placeholder="Text"/>
        <input type="text" id="comment_postId_txt" placeholder="Post ID"/>
        <input type="submit" value="Save Comment" onclick="SaveComment()"/>
    </div>
</body>

</html>
